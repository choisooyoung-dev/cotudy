# Every morning (09:00 Korea time) opens the deployed game in headless Chrome, runs every quest's code in
# all three languages, and commits the result to the private repo choisooyoung-dev/cotudy-log (daily/DATE.md).
# Needs the secret LOGS_TOKEN: a fine-grained token with "Contents: read and write" on cotudy-log only.
# The run fails (and GitHub emails you) when the check finds a problem. Details are only in the private log.
name: Daily check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: choisooyoung-dev/cotudy-log
          token: ${{ secrets.LOGS_TOKEN }}
          path: cotudy-log
      - name: Check the deployed site
        id: check
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LOG_DIR: cotudy-log
        run: node scripts/daily-check.mjs
      - name: Commit the log
        working-directory: cotudy-log
        run: |
          git config user.name "cotudy daily check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily
          git diff --cached --quiet || git commit -m "매일 점검 $(TZ=Asia/Seoul date +%F)"
          git push
      - name: Fail when the check found problems
        if: steps.check.outcome == 'failure'
        run: exit 1
